name: cd

# Continuous delivery, gated by CI.
#  * push to main: build the site (report, plan, Danish brief and its PDF) from the committed
#    outputs, which CI has just checked against the documents, and deploy it to GitHub Pages.
#    What is published is exactly what is in the repository; reproduce.yml is the workflow
#    that reruns the pipeline from the raw data.
#  * version tag (v0.2.0, ...): same build, then a GitHub Release with the wheel, the sdist,
#    a results bundle and the brief as PDF.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject v$version"; exit 1; }
      - name: Documents match the committed outputs
        run: uv run --frozen python -m rie.report --check
      - name: Build site
        run: uv run --frozen python scripts/build_site.py --out site
      - name: PDF of the brief
        run: |
          google-chrome --headless --disable-gpu --no-sandbox --no-pdf-header-footer \
            --print-to-pdf="$PWD/site/brief/beslutningsoplaeg.pdf" \
            "file://$PWD/site/brief/beslutningsoplaeg.html"
          test -s site/brief/beslutningsoplaeg.pdf
      - name: Wheel, sdist and results bundle
        run: |
          uv build
          zip -r "dist/results-${GITHUB_SHA::7}.zip" causal design brief r/r_crosscheck.json README.md
          cp site/brief/beslutningsoplaeg.pdf dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
