name: ci

on:
  push:
    branches-ignore: [main] # main runs this as the gate inside cd.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (offline, cached data in data/raw)
        run: uv run pytest
      - name: Documents match the committed run outputs
        run: uv run python -m rie.report --check

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite")'
      - name: R cross-check from the raw data
        run: Rscript r/crosscheck.R
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: R numbers agree with Python
        run: uv run pytest tests/test_causal.py -k r_crosscheck
